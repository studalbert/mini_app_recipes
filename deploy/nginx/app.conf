# ЗАМЕНИ yourdomain.com на свой реальный домен во всех местах ниже!

# ---- Фронтенд: yourdomain.com ----
server {
    listen 80;
    server_name yourdomain.com;

    # Нужно для получения/продления сертификата Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    root /var/www/frontend;
    index index.html;

    # SPA: любой путь, которого нет как файла, отдаём как index.html —
    # чтобы работал React Router при прямом заходе на /recipe/5 и т.п.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- API: api.yourdomain.com ----
server {
    listen 80;
    server_name api.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    client_max_body_size 10M;  # с запасом больше лимита фото (5МБ) на случай нескольких файлов

    # Фото отдаём напрямую через nginx, а не через FastAPI — быстрее и не грузит backend
    location /uploads/ {
        alias /var/www/uploads/;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
